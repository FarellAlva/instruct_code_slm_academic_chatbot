services:
  # ─── 1. Mesin AI Ollama (Berjalan 100% di dalam Docker) ──────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: adita-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # ─── 2. Ingestion Knowledge Base (sekali jalan, lalu berhenti) ──────────────
  # Membangun ChromaDB dari folder data/ sebelum aplikasi chat menyala.
  # Tidak butuh Ollama — hanya model embedding yang sudah di-bake ke dalam image.
  # Idempoten: jika knowledge base sudah terisi, langkah ini otomatis dilewati.
  adita-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: adita-chat:latest
    container_name: adita-ingest
    restart: "no"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import sys
        from config import DATA_DIR, CHROMA_DIR
        from rag.store import get_chroma_collection
        from ingest import run_ingestion

        collection = get_chroma_collection(CHROMA_DIR)
        existing = collection.count()

        if existing > 0:
            print(f"[docker-ingest] Knowledge base sudah terisi ({existing} chunks) - ingestion dilewati.")
            sys.exit(0)

        print("[docker-ingest] Knowledge base kosong - menjalankan ingestion dari folder data/ ...")
        run_ingestion(DATA_DIR, do_clear=False, do_scrape=False)
        PY

  # ─── 3. Web Chat Application (Adita Streamlit + RAG) ────────────────────────
  adita-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: adita-chat:latest
    container_name: adita-rag-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Terhubung langsung ke service ollama di jaringan internal Docker
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=gemma4:31b-cloud
      - DEFAULT_TEMPERATURE=0.4
      - DEFAULT_MAX_TOKENS=1536
      - DEFAULT_NUM_CTX=8192
      - MAX_CONTEXT_TOKENS=5500
      - TOP_K_RETRIEVAL=8
    depends_on:
      ollama:
        condition: service_started
      # Chat baru menyala setelah knowledge base siap
      adita-ingest:
        condition: service_completed_successfully
    volumes:
      # Mount folder data & database agar sinkron
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

volumes:
  ollama_models:
