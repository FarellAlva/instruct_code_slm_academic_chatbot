services:
  # ─── 1. Mesin AI Ollama (Berjalan 100% di dalam Docker) ──────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: adita-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # ─── 2. Web Chat Application (Adita Streamlit + RAG) ────────────────────────
  adita-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: adita-chat:latest
    container_name: adita-rag-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Terhubung langsung ke service ollama di jaringan internal Docker
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=gemma4:31b-cloud
      - DEFAULT_TEMPERATURE=0.4
      - DEFAULT_MAX_TOKENS=1536
      - DEFAULT_NUM_CTX=8192
      - MAX_CONTEXT_TOKENS=5500
      - TOP_K_RETRIEVAL=8
    depends_on:
      - ollama
    volumes:
      # Mount folder data & database agar sinkron
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

volumes:
  ollama_models:
